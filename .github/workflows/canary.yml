# Weekly canary: reinstall @deepseek-ai/*@latest (not the lockfile pins), then
# build + test. Failures open/update a dated GitHub issue.
#
# pnpm 11 without a TTY aborts with ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY
# unless CI=true — pin it even though Actions already sets it.
#
# pnpm 11 also defaults to a 24h minimumReleaseAge. The workspace already
# allowlists @deepseek-ai/* via minimumReleaseAgeExclude; this job additionally
# sets minimumReleaseAge=0 so a nested latest tag cannot be blocked.

name: Canary

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CI: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install lockfile baseline
        id: install
        run: pnpm install --frozen-lockfile

      - name: Upgrade @deepseek-ai/* to latest
        id: latest
        run: |
          set -euo pipefail
          # Workspace minimumReleaseAgeExclude covers @deepseek-ai/*; zero the
          # freshness window anyway so canary is not stuck on a 24h-old RC.
          pnpm update -r --latest --config.minimumReleaseAge=0 "@deepseek-ai/*"

      - name: Build
        id: build
        run: pnpm -r build

      - name: Typecheck
        id: typecheck
        run: pnpm typecheck

      - name: Test
        id: test
        run: pnpm test

      - name: Aggregate drift check
        id: aggregate
        run: node scripts/aggregate.mjs --check

      - name: Open or update canary issue
        if: failure()
        uses: actions/github-script@v7
        env:
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_LATEST: ${{ steps.latest.outcome }}
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_TYPECHECK: ${{ steps.typecheck.outcome }}
          STEP_TEST: ${{ steps.test.outcome }}
          STEP_AGGREGATE: ${{ steps.aggregate.outcome }}
        with:
          script: |
            const date = new Date().toISOString().slice(0, 10)
            const title = `Canary failed: @deepseek-ai/*@latest (${date})`
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.GITHUB_RUN_ID}`
            const steps = [
              ['install lockfile baseline', process.env.STEP_INSTALL],
              ['upgrade @deepseek-ai/* to latest', process.env.STEP_LATEST],
              ['build', process.env.STEP_BUILD],
              ['typecheck', process.env.STEP_TYPECHECK],
              ['test', process.env.STEP_TEST],
              ['aggregate --check', process.env.STEP_AGGREGATE],
            ]
            const stepList = steps
              .map(([name, outcome]) => `- \`${name}\`: **${outcome || 'skipped'}**`)
              .join('\n')
            const body = [
              'Weekly canary reinstalled `@deepseek-ai/*@latest` (lockfile pins ignored) and the job failed.',
              '',
              `Run: ${runUrl}`,
              '',
              '### Step outcomes',
              stepList,
              '',
              'pnpm 11 freshness: this workflow sets `minimumReleaseAge=0` and the workspace allowlists `@deepseek-ai/*` via `minimumReleaseAgeExclude`.',
              'Local pnpm without a TTY still needs `CI=true` (`ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY`).',
            ].join('\n')

            const label = 'canary'
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'B60205',
                description: 'Weekly @deepseek-ai latest canary failure',
              })
            } catch (error) {
              if (error.status !== 422) throw error
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            })
            const existing = issues.find((issue) =>
              issue.title.startsWith('Canary failed: @deepseek-ai/*@latest'),
            )

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body: `${body}\n\n---\nPreviously: ${existing.title}\n`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              })
            }
